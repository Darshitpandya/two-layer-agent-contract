# agentgateway v1.5.0 configuration
# Image: ghcr.io/agentgateway/agentgateway:v1.5.0
# Docs:  https://agentgateway.dev/docs/standalone/latest/
#
# TWO-LAYER CONTRACT
# ==================
#
# LAYER 1 — mcpAuthorization (CEL rules on mcp.tool.name)
#
#   Runs at MCP protocol layer. Handles two enforcement properties:
#
#   HIDDEN:  Tools absent from the rules are filtered out of tools/list responses.
#            The agent never sees production_admin in its tool surface.
#
#   DENIED:  The same absent tools are also denied if called directly via tools/call,
#            bypassing normal discovery. Hidden ≠ denied — both properties are enforced.
#
#   DOCUMENTED LIMITATION (agentgateway v1.5):
#   mcp.tool.arguments is NOT available in mcpAuthorization rules.
#   This is the architectural gap the talk demonstrates. Source:
#   https://agentgateway.dev/docs/standalone/latest/documentation/configuration/security/mcp-authz/
#   → section "Tool arguments are not available during authorization"
#
# LAYER 2 — mcpGuardrails with gRPC ExtMCP processor
#
#   The ExtMCP processor receives the FULL tools/call request BEFORE it reaches
#   the backend, including the parsed tool arguments.
#
#   This is where deploy(environment="production") is denied while
#   deploy(environment="staging") is allowed — the argument-sensitive decision
#   that mcpAuthorization cannot make.
#
#   failureMode: failClosed
#   When the gRPC policy processor is unreachable, requests are NOT forwarded.
#   Policy-engine failure semantics are explicit and testable.
#
# WHY THIS ARCHITECTURE:
#   mcpAuthorization — MCP-aware, controls discovery and name-based call auth
#   mcpGuardrails    — request-phase gRPC hook, sees full arguments, fail-mode explicit
#   You need both for complete enforcement. Neither alone covers all cases.

gateways:
  default:
    port: 3000

routes:
- policies:

    # -----------------------------------------------------------------------
    # LAYER 1: Tool-name authorization (mcpAuthorization)
    # mcp.tool.name is available. mcp.tool.arguments is NOT (v1.5 limitation).
    # -----------------------------------------------------------------------
    mcpAuthorization:
      rules:
      # Allow status (read-only, no side effects)
      - 'mcp.tool.name == "status"'
      # Allow deploy — argument-sensitive restriction handled by Layer 2
      - 'mcp.tool.name == "deploy"'
      # production_admin: intentionally absent
      #   HIDDEN: filtered from tools/list for all callers
      #   DENIED: rejected if called directly, regardless of discovery

    # -----------------------------------------------------------------------
    # LAYER 2: Argument-sensitive enforcement (mcpGuardrails gRPC processor)
    # The ExtMCP gRPC server receives the full tools/call request including
    # tool arguments, and returns Pass or AuthorizationError.
    # -----------------------------------------------------------------------
    mcpGuardrails:
      processors:
      - kind: remote
        # gRPC ExtMCP server — cleartext HTTP/2 (h2c) as required by agentgateway
        # host.docker.internal resolves to host machine from Docker on macOS/Windows
        # On Linux with --network=host, use localhost:9001 instead
        host: "host.docker.internal:9001"
        # failClosed: if the gRPC processor is unreachable, deny all requests
        # Change to failOpen for high-availability requirements (see docs/production-hardening.md)
        failureMode: failClosed
        methods:
          # Check tools/call BEFORE forwarding to backend (request phase)
          tools/call: request
          # tools/list: not intercepted — mcpAuthorization handles filtering

  backends:
  - mcp:
      targets:
      - name: lab-mcp-server
        # MCP server implements streamable HTTP transport (MCP protocol over HTTP).
        # host.docker.internal resolves to the Mac/Windows host from inside Docker.
        # On Linux with --network=host, use localhost instead.
        mcp:
          host: "http://host.docker.internal:3001/mcp"
