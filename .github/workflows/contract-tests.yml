name: Contract Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            mcp-server/package-lock.json
            gateway/extmcp-policy/package-lock.json
            contract-tests/package-lock.json

      # MCP server
      - name: Install and build MCP server
        run: npm ci && npm run build
        working-directory: mcp-server

      # ExtMCP policy processor
      - name: Install and build policy processor
        run: npm ci && npm run build
        working-directory: gateway/extmcp-policy

      - name: Run policy unit tests
        run: npm test
        working-directory: gateway/extmcp-policy

      # Contract tests typecheck
      - name: Install contract test dependencies
        run: npm ci
        working-directory: contract-tests

      - name: Typecheck contract tests
        run: npx tsc --noEmit
        working-directory: contract-tests

      # Note: Integration contract tests require a running agentgateway instance.
      # Run locally with: make up && make session && make verify
      # See contract-tests/README.md for details.
